# Personal CRM: one nginx serves the landing (personalcrm.site) and the app (app.personalcrm.site).
# One Let's Encrypt certificate covers both names. certbot.timer renews it via the webroot
# below and reloads nginx (see /etc/letsencrypt/renewal/personalcrm.site.conf).
# Containers publish ports on 127.0.0.1 only; the outside world reaches them through this file.

# Requests by IP or for unknown host names: drop them.
server {
    listen 80 default_server;
    listen 443 ssl http2 default_server;
    ssl_reject_handshake on;
    include snippets/personalcrm-tls.conf;
    return 444;
}

# HTTP: answer Let's Encrypt challenges, send everything else to HTTPS.
server {
    listen 80;
    server_name personalcrm.site app.personalcrm.site;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/personalcrm/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Landing: static files built by GitHub Actions into /var/www/personalcrm/landing.
server {
    listen 443 ssl http2;
    server_name personalcrm.site;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/personalcrm.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/personalcrm.site/privkey.pem;
    include snippets/personalcrm-tls.conf;

    # Security headers. "always" adds them to error pages (404) too. They are set here, in the
    # server block, because add_header from an outer level is dropped by any inner add_header.
    # CSP without nonces: inline scripts and styles are allowed; everything else only from this site.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    root /var/www/personalcrm/landing;
    location / {
        try_files $uri $uri/ =404;
    }
}

# App: the container from /opt/personal-crm (docker compose -p prod) on 127.0.0.1:3000.
server {
    listen 443 ssl http2;
    server_name app.personalcrm.site;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/personalcrm.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/personalcrm.site/privkey.pem;
    include snippets/personalcrm-tls.conf;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pages arrive in parts (React Suspense streaming); buffering would hold them back.
        proxy_buffering off;
    }
}
